    <!-- La preferencia de tema se aplica antes del primer pintado para evitar destellos -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('athos.appearance');
          var s = raw ? JSON.parse(raw) : null;
          var theme = (s && s.state && s.state.theme) || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          if (s && s.state) {
            if (s.state.fontScale) root.style.setProperty('--user-font-scale', String(s.state.fontScale));
            if (s.state.lineHeight) root.style.setProperty('--user-line-height', String(s.state.lineHeight));
            if (s.state.highContrast) root.dataset.contrast = 'high';
            if (s.state.serifUi) root.dataset.uiFont = 'serif';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
